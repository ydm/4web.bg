<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4web</title>
  <meta name="description" content="4web — web development and hosting." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="https://4web.bg/" />

  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="4web" />
  <meta property="og:title" content="4web" />
  <meta property="og:description" content="4web — web development and hosting." />
  <meta property="og:url" content="https://4web.bg/" />
  <meta property="og:image" content="https://4web.bg/logo@2x.png" />
  <meta property="og:image:width" content="720" />
  <meta property="og:image:height" content="240" />
  <meta property="og:image:alt" content="4web logo" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: #fff;
      color: #333;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .page {
      flex: 1;
      justify-content: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    .logo {
      display: block;
      width: min(360px, 80vw);
      height: auto;
      image-rendering: -webkit-optimize-contrast;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
    }

    nav a {
      color: #333;
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 0.04em;
      transition: color 0.15s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #00a8f8;
    }

    footer {
      margin-top: 2rem;
      display: flex;
      gap: 1.25rem;
      font-size: 0.8rem;
      color: #999;
    }

    footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    footer a:hover,
    footer a:focus-visible {
      color: #00a8f8;
    }
  </style>
</head>
<body>
  <main class="page">
    <img
      class="logo"
      src="logo.png"
      srcset="logo.png 1x, logo@2x.png 2x"
      width="360"
      height="120"
      alt="4web"
    />

    <nav>
      <a href="https://rubik.4web.bg">Кубче на Рубик</a>
      <a href="https://charmeth.com">CharmETH</a>
    </nav>
  </main>

  <footer>
    <a href="https://github.com/ydm">github.com/ydm</a>
    <a id="email" data-u="vonidalimnadroj" data-d="moc.liamg">jordanmiladinov [at] gmail [dot] com</a>
  </footer>

  <script>
    // Assemble the address at runtime so it never appears verbatim in the HTML.
    (function () {
      var el = document.getElementById("email");
      var rev = function (s) { return s.split("").reverse().join(""); };
      var addr = rev(el.dataset.u) + "\u0040" + rev(el.dataset.d);
      el.href = "mail" + "to:" + addr;
      el.textContent = addr;
    })();
  </script>
</body>
</html>
